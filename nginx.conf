events {}

http {
    upstream nodeapp_cluster {
        server bill-app:3000;  # Access the bill-app container on port 3000
    }

    server {
        listen 80;

        # The location block to handle /bill-app/*
        location /bill-app/ {
            # Strip the /bill-app prefix from the URL
            rewrite ^/bill-app(/.*)$ $1 break;

            # Proxy the request to the bill-app container
            proxy_pass http://nodeapp_cluster;

            # Set the headers for the proxied request
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
